name: Playwright CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      RECORD_ALL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # --- Debug: confirm secrets are visible (without printing values) ---
      - name: Debug env presence
        run: |
          node -e "console.log('BASE_URL set?', !!process.env.BASE_URL)"
          node -e "console.log('USERNAME set?', !!process.env.USERNAME)"
          node -e "console.log('PASSWORD set?', !!process.env.PASSWORD)"

      - name: Run Playwright tests
        run: npm run test:ci

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn # <- don't fail job if folder missing

      - name: Upload traces/screenshots/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

  deploy-staging:
    needs: test
    if: needs.test.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy (replace with your real commands)
        run: echo "Deploying to STAGING..."
