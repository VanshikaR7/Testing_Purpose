name: Playwright CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      RECORD_ALL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Debug: confirm secrets exist (true/false only)
      - name: Debug env presence
        run: |
          node -e "console.log('BASE_URL set?', !!process.env.BASE_URL)"
          node -e "console.log('USERNAME set?', !!process.env.USERNAME)"
          node -e "console.log('PASSWORD set?', !!process.env.PASSWORD)"

      - name: Run Playwright tests
        run: npm run test:ci

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      - name: Upload traces/screenshots/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      - name: Add summary with quick report link
        if: always()
        run: |
          echo "## ✅ Playwright Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Download the HTML Report from **Artifacts → playwright-report**" >> $GITHUB_STEP_SUMMARY
          echo "- Videos/trace/screenshots in **Artifacts → test-results**" >> $GITHUB_STEP_SUMMARY

      # --- Slack notifications ---
      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_TESTING }}
          SLACK_COLOR: "#FF0000"
          SLACK_TITLE: "❌ Playwright Tests Failed"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Triggered by:* ${{ github.actor }}
            *Workflow:* ${{ github.workflow }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 View Workflow Run>

      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_TESTING }}
          SLACK_COLOR: "#36a64f"
          SLACK_TITLE: "✅ Playwright Tests Passed"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Workflow:* ${{ github.workflow }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 View Workflow Run>

  deploy-staging:
    needs: test
    if: needs.test.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy (replace with your real commands)
        run: echo "Deploying to STAGING..."
